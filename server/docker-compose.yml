# CRDigital Remote – Server (RustDesk hbbs + hbbr)
# Start:  docker compose up -d
# Key:    cat ./data/id_ed25519.pub   (wird beim ersten Start erzeugt)
services:
  hbbs:
    container_name: crd-remote-hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: crd-remote-hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
